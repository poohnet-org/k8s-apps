# The classic ArgoCD demo app, vendored from
# https://github.com/argoproj/argocd-example-apps (guestbook)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  finalizers:
    # cascade-delete the workloads when this file is removed from the repo
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/poohnet-org/k8s-apps
    targetRevision: main
    path: workloads/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
